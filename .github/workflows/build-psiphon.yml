
name: Build Psiphon Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
            - name: Checkout source
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK and NDK
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;17.2.4988734"

      - name: Create temporary CI signing key
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$GITHUB_WORKSPACE/ci-release.jks" \
            -storetype JKS \
            -storepass android \
            -keypass android \
            -alias ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Temporary CI"

          cat > signing.properties <<'EOF'
          STORE_FILE=../ci-release.jks
          STORE_PASSWORD=android
          KEY_ALIAS=ci
          KEY_PASSWORD=android
          EOF

      - name: Check project files
        run: |
          test -f gradlew
          test -f settings.gradle
          test -f app/build.gradle
          test -f version.properties

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/PsiphonAndroid-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Psiphon-Android-APK
          path: app/build/outputs/apk/debug/PsiphonAndroid-debug.apk
          if-no-files-found: error
          retention-days: 7
